name: Cabochon static checks
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install ruff==0.17.5
      - name: Ruff
        run: python -m ruff check addons/cabochon_base addons/cabochon_manufacturing scripts
      - name: Compile Python
        run: python -m compileall -q addons/cabochon_base addons/cabochon_manufacturing scripts
      - name: XML well-formedness
        run: python scripts/validate_xml.py
  odoo-tests:
    runs-on: ubuntu-latest
    container: odoo:19.0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HOST: postgres
      PORT: '5432'
      USER: odoo
      PASSWORD: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Clean install, regression, smoke and concurrency
        run: python3 scripts/run_odoo_tests.py
