[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "__pycache__",
    "*.pyc",
    "backups", 
    ".venv", 
    "node_modules"
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    # Odoo code commonly uses direct bool comparisons in domains and SQL-ish
    # structures where aggressive simplification can make intent less clear.
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["odoo", "odoo.addons"]

[tool.ruff.lint.per-file-ignores]
"addons/**/__init__.py" = ["F401"]
"addons/**/__manifest__.py" = ["B018"]
